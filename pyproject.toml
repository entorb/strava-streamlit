[project]
name = "strava-streamlit"
version = "0.1.0"
description = " Strava Äpp V2 using Streamlit"
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    "openpyxl==3.1.5",
    "pandas==3.1.1",
    "requests==2.34.2",
    "sentry-sdk==2.74.0",
    "streamlit==1.67.0",
    "xlsxwriter==3.3.1",
]

[dependency-groups]
dev = [
    "pandas-stubs==3.1.0.261029",
    "pyright==1.1.414",
    # cp314 macOS wheels
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "tomli-w==1.2.0",
    "vulture==2.16.0",
    "watchdog==7.1.0",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]

[tool.uv]
add-bounds = "exact"
required-version = "~=0.13.6"
exclude-newer = "7 days"
# watchdog 7.0.0: first release with cp314 macOS wheels
# TODO: remove after 07.11.26
exclude-newer-package = { watchdog = false }

[tool.pyright]
include = ["src"]

[tool.vulture]
paths = ["src"]
# exclude = ["src/models.py"]
ignore_names = ["_LOGGER"]
