[project]
name = "strava-streamlit"
version = "0.1.0"
description = " Strava Äpp V2 using Streamlit"
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "requests>=2.34.2",
    "sentry-sdk>=2.73.0",
    "streamlit>=1.66.1",
    "xlsxwriter>=3.3.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "tomli-w>=1.2.0",
    "vulture>=2.16",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]

[tool.uv]
required-version = "~=0.13.6"
exclude-newer = "7 days"

[tool.uv.audit]
# cspell:disable
ignore = ["GHSA-rgxp-2hwp-jwgg"]
# cspell:enable

[tool.pyright]
include = ["src"]

[tool.vulture]
paths = ["src"]
# exclude = ["src/models.py"]
ignore_names = ["_LOGGER"]
